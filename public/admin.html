<!DOCTYPE html>
<html>
<head>
    <title>Admin - Dad's Veggies</title>
    <meta charset="UTF-8">
    <style>
        body { font-family: sans-serif; margin: 2rem; }
        .product-form { margin-top: 2rem; border-top: 2px solid #ccc; padding-top: 1rem; }
        .product-form input, .product-form select, .product-form button { margin: 5px; padding: 8px; }
        table { border-collapse: collapse; width: 100%; margin-bottom: 2rem; }
        th, td { border: 1px solid #ddd; padding: 8px; text-align: left; }
        button { cursor: pointer; }
        .status-pending { background: #fff3cd; color: #856404; padding: 4px 8px; border-radius: 20px; font-size: 12px; display: inline-block; }
        .status-confirmed { background: #cce5ff; color: #004085; padding: 4px 8px; border-radius: 20px; font-size: 12px; display: inline-block; }
        .status-dispatched { background: #d4edda; color: #155724; padding: 4px 8px; border-radius: 20px; font-size: 12px; display: inline-block; }
        .status-delivered { background: #d1ecf1; color: #0c5460; padding: 4px 8px; border-radius: 20px; font-size: 12px; display: inline-block; }
        .bulk-upload-section, .bulk-image-section { margin-top: 20px; padding: 15px; border-radius: 12px; }
        .bulk-upload-section { background: #e3f2fd; }
        .bulk-image-section { background: #e8f5e9; }
        .image-preview { max-width: 50px; max-height: 50px; border-radius: 8px; }
    </style>
</head>
<body>
<h1>🥬 Admin Dashboard</h1>
<button onclick="logout()">Logout</button>

<h2>📦 Products</h2>
<div id="products"></div>

<h2>📝 Orders</h2>
<div id="orders"></div>

<!-- Add Product Section -->
<div class="product-form">
    <h3>➕ Add New Product</h3>
    <input type="text" id="newName" placeholder="Product Name">
    <input type="number" id="newPrice" placeholder="Price (₹)">
    <input type="number" id="newStock" placeholder="Stock">
    <select id="newUnit">
        <option value="kg">Kilogram (kg)</option>
        <option value="piece">Piece (pc)</option>
        <option value="bunch">Bunch</option>
        <option value="packet">Packet</option>
    </select>
    <div class="weight-options">
        <label>Weight Options (comma separated):</label>
        <input type="text" id="newWeightOptions" placeholder="e.g., 250g,500g,1kg or 1,2,3" value="250g,500g,1kg">
    </div>
    <select id="newCategory">
        <option value="Vegetables">🥬 Fresh Produce</option>
        <option value="Masala Powders">🌶️ Masala Powders</option>
        <option value="South Indian">🍛 South Indian</option>
        <option value="Dry Groceries">🍚 Dry Groceries</option>
    </select>
    <div style="display: flex; gap: 10px; align-items: center;">
        <input type="text" id="newImageUrl" placeholder="Image URL" style="flex: 1;">
        <button type="button" onclick="fetchProductImage()" style="background: #2196f3; color: white; padding: 8px 15px; border-radius: 30px;">
            🔍 Auto‑fetch Image
        </button>
    </div>
    <input type="file" id="imageUpload" accept="image/*">
    <button onclick="uploadImage()">📤 Upload to Imgur</button>
    <button onclick="addProduct()">➕ Add Product</button>
</div>

<!-- Bulk Upload Section -->
<div class="bulk-upload-section">
    <h3>📤 Bulk Upload Products</h3>
    <div style="display: flex; gap: 15px; align-items: center; flex-wrap: wrap;">
        <a href="/api/admin/products/template" download="product_template.csv" 
           style="background: #2196f3; color: white; padding: 10px 20px; border-radius: 30px; text-decoration: none;">
           📥 Download CSV Template
        </a>
        <form id="bulkUploadForm" enctype="multipart/form-data" style="display: inline-flex; gap: 10px; align-items: center;">
            <input type="file" id="csvFile" accept=".csv" style="width: auto;">
            <button type="submit" style="background: #4caf50; color: white; padding: 10px 20px; border-radius: 30px;">
               📤 Upload & Bulk Add
            </button>
        </form>
    </div>
    <div id="bulkUploadResult" style="margin-top: 15px; display: none;"></div>
</div>

<!-- Bulk Image Fetch Section -->
<div class="bulk-image-section">
    <h3>🖼️ Bulk Auto-Fetch Images</h3>
    <p style="margin-bottom: 10px;">Automatically search and add images for all products that don't have them.</p>
    <button onclick="bulkFetchImages()" style="background: #9c27b0; color: white; padding: 10px 20px; border-radius: 30px; border: none; cursor: pointer;">
        🚀 Fetch Missing Images for All Products
    </button>
    <div id="bulkImageResult" style="margin-top: 15px; display: none;"></div>
</div>

<script>
let ordersData = [];

async function fetchAuth(url, opts={}) {
    const res = await fetch(url, opts);
    if (res.status === 401) { alert("Session expired. Please login again."); location.reload(); }
    return res.json();
}

// ==================== IMAGE FUNCTIONS ====================

async function fetchProductImage() {
    const productName = document.getElementById('newName').value.trim();
    if (!productName) {
        alert('Please enter product name first');
        return;
    }
    
    const button = event.target;
    button.textContent = '⏳ Searching...';
    button.disabled = true;
    
    try {
        const response = await fetch(`/api/search-image/${encodeURIComponent(productName)}`);
        const data = await response.json();
        
        if (data.success) {
            document.getElementById('newImageUrl').value = data.imageUrl;
            alert(`✅ Image found on ${data.source}!\nPhoto by: ${data.photographer}\n\nThe image URL has been added.`);
        } else {
            alert('No image found. Please add manually or try a different product name.');
        }
    } catch (err) {
        alert('Error fetching image. Please add manually.');
    } finally {
        button.textContent = '🔍 Auto‑fetch Image';
        button.disabled = false;
    }
}

async function uploadImage() {
    const fileInput = document.getElementById('imageUpload');
    const file = fileInput.files[0];
    if (!file) return alert('Select an image first');
    const formData = new FormData();
    formData.append('image', file);
    try {
        const response = await fetch('/api/upload-image', { method: 'POST', body: formData });
        const data = await response.json();
        if (data.success) {
            document.getElementById('newImageUrl').value = data.url;
            alert('Image uploaded successfully!');
        } else alert('Upload failed');
    } catch (err) { alert('Upload error'); }
}

// ==================== PRODUCT FUNCTIONS ====================

async function loadProducts() {
    let data = await fetchAuth('/api/admin/products');
    let html = `<table>
        <thead><tr><th>ID</th><th>Name</th><th>Price</th><th>Stock</th><th>Unit</th><th>Weight Options</th><th>Category</th><th>Image</th><th>Action</th></tr></thead>
        <tbody>`;
    data.forEach(p => {
        html += `<tr>
            <td>${p.id}</td>
            <td><input id="name${p.id}" value="${p.name.replace(/"/g, '&quot;')}"></td>
            <td><input id="price${p.id}" value="${p.price}"></td>
            <td><input id="stock${p.id}" value="${p.stock}"></td>
            <td><select id="unit${p.id}">
                <option value="kg" ${p.unit === 'kg' ? 'selected' : ''}>kg</option>
                <option value="piece" ${p.unit === 'piece' ? 'selected' : ''}>piece</option>
                <option value="bunch" ${p.unit === 'bunch' ? 'selected' : ''}>bunch</option>
                <option value="packet" ${p.unit === 'packet' ? 'selected' : ''}>packet</option>
            </select></td>
            <td><input id="weight${p.id}" value="${p.weight_options || '250g,500g,1kg'}" style="width:120px;"></td>
            <td><input id="cat${p.id}" value="${p.category || ''}"></td>
            <td>${p.image_url ? `<img src="${p.image_url}" class="image-preview" onerror="this.style.display='none'">` : 'No image'} <br><input id="img${p.id}" value="${p.image_url || ''}" style="width:150px;"></td>
            <td>
                <button onclick="updateProduct(${p.id})">Update</button>
                <button onclick="deleteProduct(${p.id})">Delete</button>
                <button onclick="fetchSingleImage(${p.id}, '${p.name.replace(/'/g, "\\'")}')" style="background:#9c27b0; color:white; margin-left:5px;">🖼️ Fetch</button>
            </td>
        </tr>`;
    });
    html += `</tbody>~`;
    document.getElementById('products').innerHTML = html;
}

async function updateProduct(id) {
    let name = document.getElementById(`name${id}`).value;
    let price = document.getElementById(`price${id}`).value;
    let stock = document.getElementById(`stock${id}`).value;
    let unit = document.getElementById(`unit${id}`).value;
    let weight_options = document.getElementById(`weight${id}`).value;
    let category = document.getElementById(`cat${id}`).value;
    let image_url = document.getElementById(`img${id}`).value;
    await fetch(`/api/admin/products/${id}`, {
        method: 'PUT',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ name, price, stock, description: "", category, image_url, unit, weight_options })
    });
    loadProducts();
}

async function deleteProduct(id) {
    if (confirm('Delete this product?')) {
        await fetch(`/api/admin/products/${id}`, { method: 'DELETE' });
        loadProducts();
    }
}

async function addProduct() {
    let name = document.getElementById('newName').value.trim();
    let price = document.getElementById('newPrice').value;
    let stock = document.getElementById('newStock').value;
    let unit = document.getElementById('newUnit').value;
    let weight_options = document.getElementById('newWeightOptions').value;
    let category = document.getElementById('newCategory').value;
    let image_url = document.getElementById('newImageUrl').value.trim();
    if (!name || !price || !stock) return alert('Please fill required fields');
    const res = await fetch('/api/admin/products', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ name, price, stock, category, image_url, unit, weight_options, description: "" })
    });
    if (res.ok) {
        alert('Product added!');
        document.getElementById('newName').value = '';
        document.getElementById('newPrice').value = '';
        document.getElementById('newStock').value = '';
        document.getElementById('newWeightOptions').value = '250g,500g,1kg';
        document.getElementById('newImageUrl').value = '';
        document.getElementById('imageUpload').value = '';
        loadProducts();
    } else alert('Failed to add product');
}

// ==================== BULK UPLOAD FUNCTIONS ====================

document.getElementById('bulkUploadForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    
    const fileInput = document.getElementById('csvFile');
    const file = fileInput.files[0];
    
    if (!file) {
        alert('Please select a CSV file');
        return;
    }
    
    if (!file.name.endsWith('.csv')) {
        alert('Please upload a CSV file');
        return;
    }
    
    const formData = new FormData();
    formData.append('csvFile', file);
    
    const resultDiv = document.getElementById('bulkUploadResult');
    resultDiv.style.display = 'block';
    resultDiv.innerHTML = '<div style="background:#fff3cd; padding:15px; border-radius:12px;">⏳ Uploading and processing... Please wait.</div>';
    
    try {
        const response = await fetch('/api/admin/products/bulk', {
            method: 'POST',
            body: formData
        });
        
        const data = await response.json();
        
        if (data.success) {
            let html = `<div style="background:#d4edda; padding:15px; border-radius:12px;">
                <strong>✅ ${data.message}</strong><br>`;
            
            if (data.inserted && data.inserted.length > 0) {
                html += `<br><strong>Added Products:</strong><ul>`;
                data.inserted.forEach(p => {
                    html += `<li>#${p.id} - ${p.name}</li>`;
                });
                html += `</ul>`;
            }
            
            if (data.errors && data.errors.length > 0) {
                html += `<br><strong>⚠️ Errors:</strong><ul style="color:#856404;">`;
                data.errors.forEach(err => {
                    html += `<li>${err}</li>`;
                });
                html += `</ul>`;
            }
            
            html += `</div>`;
            resultDiv.innerHTML = html;
            
            loadProducts();
            fileInput.value = '';
        } else {
            resultDiv.innerHTML = `<div style="background:#f8d7da; padding:15px; border-radius:12px;">
                <strong>❌ Error:</strong> ${data.error || 'Upload failed'}
            </div>`;
        }
    } catch (err) {
        resultDiv.innerHTML = `<div style="background:#f8d7da; padding:15px; border-radius:12px;">
            <strong>❌ Error:</strong> ${err.message}
        </div>`;
    }
});

// ==================== BULK IMAGE FETCH FUNCTIONS ====================

async function bulkFetchImages() {
    if (!confirm('This will search and add images for ALL products without images. Continue?')) {
        return;
    }
    
    const resultDiv = document.getElementById('bulkImageResult');
    resultDiv.style.display = 'block';
    resultDiv.innerHTML = '<div style="background:#fff3cd; padding:15px; border-radius:12px;">⏳ Fetching images for all products... This may take a few minutes.</div>';
    
    try {
        const response = await fetch('/api/admin/bulk-fetch-images', {
            method: 'POST'
        });
        const data = await response.json();
        
        if (data.success) {
            let html = `<div style="background:#d4edda; padding:15px; border-radius:12px;">
                <strong>✅ ${data.message}</strong><br>
                Total products processed: ${data.total}<br>
                Images fetched: ${data.updated}<br>
                Failed: ${data.failed}<br><br>`;
            
            if (data.results && data.results.length > 0) {
                html += `<details>
                    <summary>View Details</summary>
                    <ul style="margin-top:10px; max-height:200px; overflow-y:auto;">`;
                
                data.results.forEach(r => {
                    if (r.status === 'success') {
                        html += `<li style="color:green;">✅ ${r.name}</li>`;
                    } else {
                        html += `<li style="color:red;">❌ ${r.name} - ${r.reason}</li>`;
                    }
                });
                
                html += `</ul></details>`;
            }
            
            html += `</div>`;
            resultDiv.innerHTML = html;
            
            loadProducts();
        } else {
            resultDiv.innerHTML = `<div style="background:#f8d7da; padding:15px; border-radius:12px;">
                <strong>❌ Error:</strong> ${data.error}
            </div>`;
        }
    } catch (err) {
        resultDiv.innerHTML = `<div style="background:#f8d7da; padding:15px; border-radius:12px;">
            <strong>❌ Error:</strong> ${err.message}
        </div>`;
    }
}

async function fetchSingleImage(productId, productName) {
    if (!confirm(`Fetch image for ${productName}?`)) return;
    
    const buttons = document.querySelectorAll(`button[onclick*="fetchSingleImage(${productId},"]`);
    const button = buttons[0];
    const originalText = button.textContent;
    button.textContent = '⏳ Fetching...';
    button.disabled = true;
    
    try {
        const response = await fetch(`/api/admin/fetch-single-image/${productId}`, {
            method: 'POST'
        });
        const data = await response.json();
        
        if (data.success) {
            alert(`✅ ${data.message}`);
            loadProducts();
        } else {
            alert(`❌ ${data.message}`);
        }
    } catch (err) {
        alert('Error fetching image');
    } finally {
        button.textContent = originalText;
        button.disabled = false;
    }
}

// ==================== ORDER FUNCTIONS ====================

async function loadOrders() {
    let orders = await fetchAuth('/api/admin/orders');
    ordersData = orders;
    let html = `<table>
        <thead><tr><th>ID</th><th>Customer</th><th>Total</th><th>Payment</th><th>Status</th><th>Delivery Slot</th><th>Actions</th></tr></thead>
        <tbody>`;
    orders.forEach(o => {
        let statusClass = '';
        if (o.order_status === 'pending') statusClass = 'status-pending';
        else if (o.order_status === 'confirmed') statusClass = 'status-confirmed';
        else if (o.order_status === 'dispatched') statusClass = 'status-dispatched';
        else if (o.order_status === 'delivered') statusClass = 'status-delivered';
        
        html += `<tr>
            <td>${o.id}</td>
            <td>${o.customer_name}<br>${o.customer_phone}<br>${o.customer_address}</td>
            <td>₹${o.total_amount}</td>
            <td>${o.payment_status === 'paid' ? '✅ Paid' : '⏳ Pending'}</td>
            <td><span class="${statusClass}">${o.order_status.toUpperCase()}</span></td>
            <td>${o.delivery_slot || 'Not selected'}</td>
            <td>
                ${o.payment_status !== 'paid' ? `<button onclick="markPaid(${o.id})" style="background:#4caf50; color:white;">✅ Confirm Payment & Send WhatsApp</button>` : ''}
                ${o.payment_status === 'paid' && o.order_status === 'confirmed' ? `<button onclick="markDispatched(${o.id})" style="background:#2196f3; color:white;">🚚 Mark Dispatched & Send WhatsApp</button>` : ''}
                ${o.order_status === 'dispatched' ? `<button onclick="markDelivered(${o.id})" style="background:#ff9800; color:white;">🎉 Mark Delivered & Send WhatsApp</button>` : ''}
                ${o.order_status === 'delivered' ? '<span style="color:green;">✓ Completed</span>' : ''}
            </td>
        </tr>`;
    });
    html += `</tbody>~`;
    document.getElementById('orders').innerHTML = html;
}

async function markPaid(id) {
    const order = ordersData.find(o => o.id === id);
    if (confirm(`Confirm payment for Order #${id}? WhatsApp will be sent to ${order.customer_phone}`)) {
        const res = await fetch(`/api/admin/orders/${id}/pay`, { method: 'PUT' });
        const data = await res.json();
        if (data.success) {
            const message = encodeURIComponent(`✅ Order #${id} CONFIRMED!\nAmount: ₹${order.total_amount}\nYour order will be prepared and dispatched soon. - Dad's Veggie Shop`);
            window.open(`https://wa.me/${order.customer_phone}?text=${message}`, '_blank');
            loadOrders();
            loadProducts();
        }
    }
}

async function markDispatched(id) {
    const order = ordersData.find(o => o.id === id);
    if (confirm(`Mark Order #${id} as dispatched? WhatsApp will be sent to ${order.customer_phone}`)) {
        const res = await fetch(`/api/admin/orders/${id}/dispatch`, { method: 'PUT' });
        const data = await res.json();
        if (data.success) {
            const message = encodeURIComponent(`🚚 Order #${id} DISPATCHED!\nYour order is on the way! - Dad's Veggie Shop`);
            window.open(`https://wa.me/${order.customer_phone}?text=${message}`, '_blank');
            loadOrders();
            loadProducts();
        }
    }
}

async function markDelivered(id) {
    const order = ordersData.find(o => o.id === id);
    if (confirm(`Mark Order #${id} as delivered? WhatsApp will be sent to ${order.customer_phone}`)) {
        const res = await fetch(`/api/admin/orders/${id}/deliver`, { method: 'PUT' });
        const data = await res.json();
        if (data.success) {
            const message = encodeURIComponent(`🎉 Order #${id} DELIVERED!\nThank you for shopping with Dad's Veggie Shop! 🥬`);
            window.open(`https://wa.me/${order.customer_phone}?text=${message}`, '_blank');
            loadOrders();
            loadProducts();
        }
    }
}

async function logout() {
    await fetch('/admin/logout');
    location.reload();
}

// ==================== SINGLE IMAGE FETCH FUNCTION ====================
async function fetchSingleImage(productId, productName) {
    if (!confirm(`Fetch image for ${productName}? This will search Pixabay for a matching image.`)) {
        return;
    }
    
    // Find the button that was clicked
    const buttons = document.querySelectorAll(`button[onclick*="fetchSingleImage(${productId},"]`);
    const button = buttons[0];
    if (!button) {
        console.error('Button not found');
        return;
    }
    
    const originalText = button.textContent;
    button.textContent = '⏳ Searching...';
    button.disabled = true;
    
    try {
        const response = await fetch(`/api/admin/fetch-single-image/${productId}`, {
            method: 'POST'
        });
        const data = await response.json();
        
        if (data.success) {
            alert(`✅ ${data.message}`);
            // Refresh the product list to show the new image
            loadProducts();
        } else {
            alert(`❌ ${data.message || 'No image found for this product'}`);
        }
    } catch (err) {
        console.error('Fetch error:', err);
        alert('❌ Error fetching image. Please try again.');
    } finally {
        button.textContent = originalText;
        button.disabled = false;
    }
}

// ==================== INITIAL LOAD ====================
loadProducts();
loadOrders();
setInterval(() => loadOrders(), 10000);
</script>
</body>
</html>
