<!DOCTYPE html>
<html>
<head>
    <title>Admin - Dad's Veggies</title>
    <meta charset="UTF-8">
    <style>
        body { font-family: sans-serif; margin: 2rem; }
        .product-form { margin-top: 2rem; border-top: 2px solid #ccc; padding-top: 1rem; }
        .product-form input, .product-form select, .product-form button { margin: 5px; padding: 8px; }
        table { border-collapse: collapse; width: 100%; margin-bottom: 2rem; }
        th, td { border: 1px solid #ddd; padding: 8px; text-align: left; }
        button { cursor: pointer; }
    </style>
</head>
<body>
<h1>🥬 Admin Dashboard</h1>
<button onclick="logout()">Logout</button>

<h2>📦 Products</h2>
<div id="products"></div>

<h2>📝 Orders</h2>
<div id="orders"></div>

<!-- Enhanced Add Product Section -->
<div class="product-form">
    <h3>➕ Add New Product</h3>
    <input type="text" id="newName" placeholder="Product Name">
    <input type="number" id="newPrice" placeholder="Price (₹)">
    <input type="number" id="newStock" placeholder="Stock (kg)">
    <select id="newCategory">
        <option value="Vegetables">🥬 Fresh Produce</option>
        <option value="Masala Powders">🌶️ Masala Powders (Spices & Blends)</option>
        <option value="South Indian">🍛 South Indian (Ready-to-Make / Snacks)</option>
        <option value="Dry Groceries">🍚 Dry Groceries (Lentils & Rice)</option>
    </select>
    <input type="text" id="newImageUrl" placeholder="Image URL (or upload below)" style="width: 300px;">
    <input type="file" id="imageUpload" accept="image/*">
    <button onclick="uploadImage()">📤 Upload to Imgur</button>
    <button onclick="addProduct()">➕ Add Product</button>
</div>

<script>
// ---------- Helper for authenticated fetch ----------
async function fetchAuth(url, opts={}) {
    const res = await fetch(url, opts);
    if (res.status === 401) {
        alert("Session expired. Please login again.");
        location.reload();
    }
    return res.json();
}

// ---------- Load and display products ----------
async function loadProducts() {
    let data = await fetchAuth('/api/admin/products');
    let html = '<table><tr><th>ID</th><th>Name</th><th>Price</th><th>Stock</th><th>Category</th><th>Image URL</th><th>Action</th></tr>';
    data.forEach(p => {
        html += `<tr>
            <td>${p.id}</td>
            <td><input id="name${p.id}" value="${p.name}"></td>
            <td><input id="price${p.id}" value="${p.price}"></td>
            <td><input id="stock${p.id}" value="${p.stock}"></td>
            <td><input id="cat${p.id}" value="${p.category || ''}"></td>
            <td><input id="img${p.id}" value="${p.image_url || ''}" style="width:150px;"></td>
            <td>
                <button onclick="updateProduct(${p.id})">Update</button>
                <button onclick="deleteProduct(${p.id})">Delete</button>
            </td>
        </tr>`;
    });
    document.getElementById('products').innerHTML = html;
}

// ---------- Update product (including category & image) ----------
async function updateProduct(id) {
    let name = document.getElementById(`name${id}`).value;
    let price = document.getElementById(`price${id}`).value;
    let stock = document.getElementById(`stock${id}`).value;
    let category = document.getElementById(`cat${id}`).value;
    let image_url = document.getElementById(`img${id}`).value;
    await fetch(`/api/admin/products/${id}`, {
        method: 'PUT',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ name, price, stock, description: "", category, image_url })
    });
    loadProducts();
}

// ---------- Delete product ----------
async function deleteProduct(id) {
    if (confirm('Delete this product?')) {
        await fetch(`/api/admin/products/${id}`, { method: 'DELETE' });
        loadProducts();
    }
}

// ---------- Upload image to Imgur ----------
async function uploadImage() {
    const fileInput = document.getElementById('imageUpload');
    const file = fileInput.files[0];
    if (!file) return alert('Select an image first');
    
    const formData = new FormData();
    formData.append('image', file);
    
    try {
        const response = await fetch('/api/upload-image', {
            method: 'POST',
            body: formData
        });
        const data = await response.json();
        if (data.success) {
            document.getElementById('newImageUrl').value = data.url;
            alert('Image uploaded successfully!');
        } else {
            alert('Upload failed: ' + (data.error || 'Unknown error'));
        }
    } catch (err) {
        alert('Upload error: ' + err.message);
    }
}

// ---------- Add new product with category and image ----------
async function addProduct() {
    let name = document.getElementById('newName').value.trim();
    let price = document.getElementById('newPrice').value;
    let stock = document.getElementById('newStock').value;
    let category = document.getElementById('newCategory').value;
    let image_url = document.getElementById('newImageUrl').value.trim();
    
    if (!name || !price || !stock) {
        alert('Please fill Name, Price, and Stock');
        return;
    }
    
    const res = await fetch('/api/admin/products', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
            name, price, stock, category, image_url,
            description: ""
        })
    });
    if (res.ok) {
        alert('Product added!');
        // Clear form
        document.getElementById('newName').value = '';
        document.getElementById('newPrice').value = '';
        document.getElementById('newStock').value = '';
        document.getElementById('newCategory').value = 'Vegetables';
        document.getElementById('newImageUrl').value = '';
        document.getElementById('imageUpload').value = '';
        loadProducts();  // refresh product list
    } else {
        alert('Failed to add product');
    }
}

// ---------- Load orders ----------
async function loadOrders() {
    let orders = await fetchAuth('/api/admin/orders');
    let html = '<table><tr><th>ID</th><th>Customer</th><th>Total</th><th>Payment</th><th>Status</th><th>Delivery Slot</th><th>Actions</th></tr>';
    orders.forEach(o => {
        html += `<tr>
            <td>${o.id}</td>
            <td>${o.customer_name}<br>${o.customer_phone}<br>${o.customer_address}</td>
            <td>₹${o.total_amount}</td>
            <td>${o.payment_status}</td>
            <td>${o.order_status}</td>
            <td>${o.delivery_slot || 'Not selected'}</td>
            <td>
                ${o.payment_status !== 'paid' ? `<button onclick="markPaid(${o.id})">✅ Confirm Payment</button>` : ''}
                ${o.order_status !== 'delivered' ? `<button onclick="markDelivered(${o.id})">🚚 Mark Delivered</button>` : ''}
            </td>
        </tr>`;
    });
    document.getElementById('orders').innerHTML = html;
}

async function markPaid(id) {
    await fetch(`/api/admin/orders/${id}/pay`, { method: 'PUT' });
    loadOrders();
    loadProducts();
}

async function markDelivered(id) {
    await fetch(`/api/admin/orders/${id}/deliver`, { method: 'PUT' });
    loadOrders();
}

async function logout() {
    await fetch('/admin/logout');
    location.reload();
}

// ---------- Initial load and auto-refresh orders ----------
loadProducts();
loadOrders();
setInterval(() => loadOrders(), 10000);
</script>
</body>
</html>
